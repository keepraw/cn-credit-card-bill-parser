name: Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  # Supersede PR checks, but never interrupt a running production deployment.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      # Minimal browser install: Chromium only (plus its Linux system deps).
      # No test records video (see playwright.config.ts `video: 'off'`), so the
      # Playwright-bundled FFmpeg binary that ships with every browser install
      # is never invoked; screenshots/traces on failure are kept for debugging.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload validated GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: web/dist
          retention-days: 1

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q

  deploy:
    needs: [web, python]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Concurrency queues are not ordered. Reject a superseded main revision
      # after acquiring the deployment slot, without rebuilding its artifact.
      - name: Check current main revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current_sha" = "$VALIDATED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping a superseded main revision."
          fi
      - name: Configure GitHub Pages
        if: steps.revision.outputs.current == 'true'
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        if: steps.revision.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
